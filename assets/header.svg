<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090e1a" />
    </linearGradient>

    <!-- Glowing Neon Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Main Title Radiant Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Top Accent Bar Gradient -->
    <linearGradient id="topBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Corner Ambient Glows -->
    <radialGradient id="cyanGlow" cx="10%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="90%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>

    <!-- High-Contrast Tech Dot Grid -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseLive {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.6; }
    }
    .pulse-dot {
      animation: pulseLive 2s ease-in-out infinite;
      transform-origin: center;
    }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; }
  </style>

  <!-- Card Background -->
  <rect width="850" height="240" rx="16" fill="url(#cardBg)" stroke="url(#neonBorder)" stroke-width="2" />

  <!-- Ambient Glow Effects -->
  <rect width="850" height="240" rx="16" fill="url(#cyanGlow)" />
  <rect width="850" height="240" rx="16" fill="url(#purpleGlow)" />

  <!-- Dot Grid Overlay -->
  <rect width="850" height="240" rx="16" fill="url(#dotGrid)" />

  <!-- Top Accent Highlight Bar -->
  <path d="M 40 2 L 240 2" stroke="url(#topBarGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M 810 2 L 690 2" stroke="#818cf8" stroke-width="3" stroke-linecap="round" />

  <!-- STATUS LINE (Top) - High Contrast & Crisp -->
  <g transform="translate(42, 38)">
    <!-- Status Dot -->
    <circle cx="6" cy="6" r="5" fill="#22c55e" class="pulse-dot" />
    <circle cx="6" cy="6" r="2" fill="#ffffff" />
    
    <text x="22" y="11" fill="#4ade80" class="mono" font-size="12" font-weight="700" letter-spacing="1">SYSTEMS ACTIVE</text>
    <text x="150" y="11" fill="#94a3b8" class="mono" font-size="12" font-weight="600">//</text>
    
    <text x="175" y="11" fill="#ffffff" class="mono" font-size="12" font-weight="600" letter-spacing="0.5">17 PRODUCTION DEPLOYMENTS</text>
    <text x="405" y="11" fill="#94a3b8" class="mono" font-size="12" font-weight="600">//</text>
    
    <text x="430" y="11" fill="#38bdf8" class="mono" font-size="12" font-weight="700" letter-spacing="1">BENGALURU, INDIA</text>
  </g>

  <!-- MAIN IDENTITY TITLE -->
  <g transform="translate(42, 104)">
    <text x="0" y="0" fill="url(#titleGradient)" class="sans" font-size="48" font-weight="900" letter-spacing="-0.5">MAYANK RAJ</text>
    
    <!-- Monogram Pill Badge -->
    <rect x="375" y="-36" width="105" height="30" rx="8" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5" />
    <text x="427" y="-16" fill="#38bdf8" class="mono" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">[ 0xMRG ]</text>
  </g>

  <!-- ROLE SUBTITLE -->
  <g transform="translate(42, 138)">
    <text x="0" y="0" fill="#ffffff" class="mono" font-size="15.5" font-weight="800" letter-spacing="1.5">FULL-STACK SYSTEMS ARCHITECT &amp; AI RESEARCHER</text>
  </g>

  <!-- 4 VIBRANT HIGH-CONTRAST CHIPS -->
  <g transform="translate(42, 168)">
    <!-- Chip 1: Praxirence AI -->
    <rect x="0" y="0" width="168" height="34" rx="8" fill="#0369a1" fill-opacity="0.35" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="16" cy="17" r="4" fill="#38bdf8" />
    <text x="28" y="22" fill="#ffffff" class="mono" font-size="12" font-weight="700">PRAXIRENCE AI</text>

    <!-- Chip 2: Python & PyTorch -->
    <rect x="180" y="0" width="186" height="34" rx="8" fill="#1d4ed8" fill-opacity="0.35" stroke="#60a5fa" stroke-width="1.5" />
    <circle cx="196" cy="17" r="4" fill="#60a5fa" />
    <text x="208" y="22" fill="#ffffff" class="mono" font-size="12" font-weight="700">PYTHON &amp; PYTORCH</text>

    <!-- Chip 3: Next.js 15 & React 19 -->
    <rect x="378" y="0" width="205" height="34" rx="8" fill="#6d28d9" fill-opacity="0.35" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="394" cy="17" r="4" fill="#c084fc" />
    <text x="406" y="22" fill="#ffffff" class="mono" font-size="12" font-weight="700">NEXT.JS 15 / REACT 19</text>

    <!-- Chip 4: 17 Production Apps -->
    <rect x="595" y="0" width="170" height="34" rx="8" fill="#047857" fill-opacity="0.35" stroke="#34d399" stroke-width="1.5" />
    <circle cx="611" cy="17" r="4" fill="#34d399" />
    <text x="623" y="22" fill="#ffffff" class="mono" font-size="12" font-weight="700">17 LIVE SYSTEMS</text>
  </g>

  <!-- Bottom Corner Timestamp Stamp -->
  <text x="808" y="224" fill="#94a3b8" class="mono" font-size="10" font-weight="600" text-anchor="end" letter-spacing="1">ARCH://2026.10</text>
</svg>
